# ─────────────────────────────────────────────────────────────────────────────
# params.yaml — all tunable parameters tracked by DVC
#
# LAYER SELECTION:
#   Change whisper_layer or xlsr_layer here, then run `dvc repro`.
#   DVC will detect the change and re-run extract_whisper / extract_xlsr
#   and every downstream stage automatically.
#
#   Valid Whisper layers  : 1–24  (medium)   | lower half 1–8, upper half 17–24
#   Valid XLS-R layers    : 1–24  (xlsr-53)  | lower 1–6, mid 7–12, upper 13–24
# ─────────────────────────────────────────────────────────────────────────────

# ── corpus paths ──────────────────────────────────────────────────────────────
data_path: "./ru-fr_interference/2/wav_et_textgrids/FRcorp_textgrids_only"
meta_path: "./ru-fr_interference/2/metadata_RUFR.csv"
corr_path: "./ru-fr_interference/2/RUFRcorr.csv"

# ── acoustic extraction ───────────────────────────────────────────────────────
measure_point: "0.5"        # "0.25" | "0.5" | "0.75"
max_formant_female: 5000    # Hz
max_formant_male:   4500    # Hz
n_formants: 5

# ── neural models & layer selection ──────────────────────────────────────────
whisper_model: "openai/whisper-medium"
whisper_layer: 8            # ← change this to 24 for upper-half experiment

xlsr_model: "facebook/wav2vec2-large-xlsr-53"
xlsr_layer: 12              # ← change this to 6 or 24 for layer experiments

# ── dimensionality reduction ──────────────────────────────────────────────────
reduce_method: "pca"        # "pca" | "umap"  (for 2D visualisation stage)
reduce_seed: 42

# ── plots ─────────────────────────────────────────────────────────────────────
plot_subset: "1,2,3"        # rep_ids for intra-speaker variability plot

# ── statistical tests ─────────────────────────────────────────────────────────
n_perm: 9999
n_boot: 2000
alpha:  0.05

# ── LME ──────────────────────────────────────────────────────────────────────
n_pc_lme: 5

# ── clustering ────────────────────────────────────────────────────────────────
k_values_vowel:   "2,3,4,5,6"
k_values_cv:      "2,3,4,5,6,7,8"
k_values_speaker: "2,3,4"
